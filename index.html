<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02050d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TIME"><link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png"><link rel="manifest" href="/time/manifest.json"><link rel="stylesheet" href="./css/style.css"><title>TIME</title></head><body><div id="bg"></div><div id="shade"></div><main>
<header><div class="datebox"><div id="date"></div><div id="weekday"></div></div><div class="weather">◯ <span>LOCAL TIME</span></div></header>
<section class="clock-area"><div id="flipClock"><div class="pair"><div class="flip"></div><div class="flip"></div></div><b>:</b><div class="pair"><div class="flip"></div><div class="flip"></div></div><b>:</b><div class="pair seconds"><div class="flip"></div><div class="flip"></div></div></div><div class="local-label"><i></i> L O C A L &nbsp; T I M E <i></i></div></section>
<footer><div class="alarm-status"><div class="bell">♧</div><div><div class="mini-title">NEXT ALARM</div><div id="nextAlarm">--:--</div></div><div class="vline"></div><div id="countdown">NO ALARM</div></div><div class="actions"><button id="alarmBtn">◷<small>闹钟</small></button><button id="menu">⚙<small>设置</small></button><button id="nightBtn">☾<small>夜间</small></button><button id="fullscreen">⛶<small>全屏</small></button><button id="installBtn" hidden>＋<small>安装</small></button></div></footer>
<aside id="panel" class="panel"><div class="panel-title"><b>CONTROL</b><button id="close">×</button></div><div class="group"><div class="group-title">闹钟</div><div id="alarms"></div><button id="newAlarm" class="primary">＋ 添加闹钟</button></div><div class="group"><div class="group-title">显示</div><label>24 小时制 <input id="use24" type="checkbox" checked></label><label>显示秒数 <input id="seconds" type="checkbox" checked></label><label>夜间低亮度 <input id="night" type="checkbox"></label></div><div class="group"><button id="wake" class="secondary">保持屏幕常亮</button></div></aside>
<div id="alarmEditor" class="overlay"><div class="card"><div class="panel-title"><b>NEW ALARM</b><button id="cancel">×</button></div><label>时间<input id="alarmTime" type="time" value="07:30"></label><label>重复<select id="repeat"><option value="once">仅一次</option><option value="daily">每天</option><option value="weekdays">工作日</option><option value="weekends">周末</option></select></label><label>标签<input id="alarmLabel" maxlength="20" placeholder="例如：起床"></label><button id="save" class="primary">保存</button></div></div>
<div id="ring" class="overlay"><div class="ring card"><div class="ring-title">ALARM</div><div id="ringTime">07:30</div><div id="ringLabel">WAKE UP</div><button id="stop" class="primary">停止</button><button id="snooze" class="secondary">5 分钟后再响</button></div></div>
</main><script src="./js/clock.js"></script><script src="./js/alarm.js"></script><script src="./js/app.js"></script></body></html>
