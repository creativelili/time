<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03050b"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./css/style.css"><title>TIME</title></head><body><div id="bg"></div><canvas id="stars"></canvas><main><header><div id="weekday">WEDNESDAY</div><div id="date">16 SEP 2026</div></header><section class="center"><div id="clock">--:--:--</div><div class="local">LOCAL TIME</div></section><footer><div class="next-label">NEXT ALARM</div><div id="nextAlarm">--:--</div><div id="countdown">NO ALARM</div></footer><button id="menu" class="menu">☰</button><aside id="panel" class="panel"><div class="panel-title"><b>CONTROL</b><button id="close">×</button></div><div class="group"><div class="group-title">闹钟</div><div id="alarms"></div><button id="newAlarm" class="primary">＋ 添加闹钟</button></div><div class="group"><div class="group-title">显示</div><label>24 小时制 <input id="use24" type="checkbox" checked></label><label>显示秒数 <input id="seconds" type="checkbox" checked></label><label>夜间低亮度 <input id="night" type="checkbox"></label><label>星空背景 <input id="starsOn" type="checkbox" checked></label></div><div class="group"><button id="fullscreen" class="secondary">进入全屏</button><button id="wake" class="secondary">保持屏幕常亮</button></div><small>设置保存在本机。点击空白处关闭。</small></aside><div id="alarmEditor" class="overlay"><div class="card"><div class="panel-title"><b>NEW ALARM</b><button id="cancel">×</button></div><label>时间<input id="alarmTime" type="time" value="07:30"></label><label>重复<select id="repeat"><option value="once">仅一次</option><option value="daily">每天</option><option value="weekdays">工作日</option><option value="weekends">周末</option></select></label><label>标签<input id="alarmLabel" maxlength="20" placeholder="例如：起床"></label><button id="save" class="primary">保存</button></div></div><div id="ring" class="overlay"><div class="ring card"><div class="ring-title">ALARM</div><div id="ringTime">07:30</div><div id="ringLabel">WAKE UP</div><button id="stop" class="primary">停止</button><button id="snooze" class="secondary">5 分钟后再响</button></div></div></main><script src="./js/clock.js"></script><script src="./js/alarm.js"></script><script src="./js/app.js"></script></body></html>
